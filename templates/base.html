{% load static %}
<!DOCTYPE html>
<html lang="it">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width,initial-scale=1.0" />
        <title>{% block title %}Dance School{% endblock %}</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
              rel="stylesheet"
              integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
              crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
                integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
                crossorigin="anonymous"
                defer></script>
        <link href="{% static 'css/style.css' %}" rel="stylesheet" />
    </head>
    <body>
        {% include "components/navbar.html" %}
        <main class="container py-4">
            {% block content %}{% endblock %}
        </main>
        <footer class="container border-top py-3 small text-body-secondary">
            <address class="mb-1">Via dello Sport 42, Modena, 41124</address>
            <p class="mb-1">Telefono: 059 424242</p>
            <p class="mb-0">
                Email: <a href="mailto:email@dance-school.it">email@dance-school.it</a>
            </p>
        </footer>
    </body>
</html>
